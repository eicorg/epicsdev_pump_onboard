[project]
name = "epicsdev-pump-onboard"
version = "0.1.0"
description = "EPICS PVAccess server for On-Board cryopumps"
readme = "README.md"
authors = [
    { name = "Sukhanov, Andrei", email = "sukhanov@bnl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "epicsdev>=3.3.6",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    #"pyserial>=3.5",
]

[project.scripts]
epicsdev-pump-onboard = "epicsdev_pump_onboard.__main__:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
